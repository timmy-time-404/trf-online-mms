name: Deploy

# main = production. Every push to main is checked, then waits for an approval
# in the "production" environment before it is released to the VPS.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_to:
        description: Release tag to roll back to (leave empty to deploy this commit)
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    if: ${{ !inputs.rollback_to }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  deploy:
    needs: check
    if: ${{ always() && (needs.check.result == 'success' || inputs.rollback_to) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://meong-mms.org
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Release
        if: ${{ !inputs.rollback_to }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          tag="v-$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}"
          git archive --format=tar.gz HEAD | ssh -i ~/.ssh/deploy "$DEPLOY_HOST" "release $tag"
          echo "Released $tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Roll back
        if: ${{ inputs.rollback_to }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          TAG: ${{ inputs.rollback_to }}
        run: ssh -i ~/.ssh/deploy "$DEPLOY_HOST" "rollback $TAG"
      - name: Public health check
        run: curl -fsS https://meong-mms.org/api/health && curl -fsS -o /dev/null https://meong-mms.org/
