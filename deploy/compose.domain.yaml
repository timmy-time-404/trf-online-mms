# Opt-in public TLS gateway; keep the base gateway bound to localhost.
services:
  public-gateway:
    image: ${CADDY_IMAGE:-caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to the verified public domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.domain:/etc/caddy/Caddyfile:ro
      - tls-data:/data
      - tls-config:/config
    networks: [application]
    depends_on:
      gateway:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/health]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: ${LOG_DRIVER:-journald}

volumes:
  tls-data:
  tls-config:
